<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8E84CF" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#8E84CF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8E84CF" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescentMask" maskUnits="userSpaceOnUse">
      <rect x="432" y="112" width="96" height="96" fill="black"/>
      <circle cx="480" cy="160" r="38" fill="white"/>
      <circle cx="496" cy="150" r="34" fill="black"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#0E0D16"/>

  <!-- Violet glow -->
  <ellipse cx="640" cy="160" rx="420" ry="180" fill="url(#glowGrad)"/>

  <!-- Crescent moon logo -->
  <rect x="432" y="112" width="96" height="96" mask="url(#crescentMask)" fill="#DDD8F8"/>

  <!-- Wordmark -->
  <text
    x="552"
    y="160"
    dominant-baseline="central"
    font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-1"
    fill="#F3F5FF"
  >LuniVex</text>
</svg>
