<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <!-- Tight glow behind crescent only -->
    <radialGradient id="crescentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8E84CF" stop-opacity="0.18"/>
      <stop offset="55%"  stop-color="#8E84CF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8E84CF" stop-opacity="0"/>
    </radialGradient>

    <!-- Crescent moon mask -->
    <mask id="cm" maskUnits="userSpaceOnUse">
      <rect x="440" y="112" width="96" height="96" fill="black"/>
      <circle cx="488" cy="160" r="38" fill="white"/>
      <circle cx="504" cy="150" r="34" fill="black"/>
    </mask>

    <!-- Shooting star: tail (transparent) -> head (white) -->
    <linearGradient id="shootGrad" x1="95" y1="48" x2="285" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Bottom horizon glow -->
    <linearGradient id="horizGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8E84CF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8E84CF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#0E0D16"/>

  <!-- Stars - left section -->
  <circle cx="65"  cy="42"  r="1.5" fill="white" opacity="0.90"/>
  <circle cx="175" cy="78"  r="1"   fill="white" opacity="0.50"/>
  <circle cx="250" cy="28"  r="2"   fill="white" opacity="0.75"/>
  <circle cx="320" cy="58"  r="1.5" fill="white" opacity="0.60"/>
  <circle cx="95"  cy="185" r="1"   fill="white" opacity="0.45"/>
  <circle cx="205" cy="258" r="1.5" fill="white" opacity="0.85"/>
  <circle cx="350" cy="278" r="1"   fill="white" opacity="0.50"/>
  <circle cx="60"  cy="300" r="2"   fill="white" opacity="0.60"/>
  <circle cx="138" cy="142" r="1"   fill="white" opacity="0.40"/>

  <!-- Stars - above/below logo -->
  <circle cx="410" cy="35"  r="2"   fill="white" opacity="0.80"/>
  <circle cx="700" cy="30"  r="1.5" fill="white" opacity="0.70"/>
  <circle cx="490" cy="295" r="1"   fill="white" opacity="0.40"/>
  <circle cx="650" cy="290" r="1.5" fill="white" opacity="0.55"/>

  <!-- Stars - right section -->
  <circle cx="900"  cy="38"  r="2"   fill="white" opacity="0.90"/>
  <circle cx="1065" cy="68"  r="1.5" fill="white" opacity="0.50"/>
  <circle cx="1160" cy="48"  r="1"   fill="white" opacity="0.70"/>
  <circle cx="980"  cy="195" r="1.5" fill="white" opacity="0.60"/>
  <circle cx="1118" cy="225" r="1"   fill="white" opacity="0.40"/>
  <circle cx="1210" cy="268" r="2"   fill="white" opacity="0.80"/>
  <circle cx="1052" cy="290" r="1.5" fill="white" opacity="0.50"/>

  <!-- Shooting star -->
  <line x1="95" y1="48" x2="285" y2="128" stroke="url(#shootGrad)" stroke-width="1"/>

  <!-- Tight violet glow behind crescent -->
  <ellipse cx="488" cy="160" rx="88" ry="88" fill="url(#crescentGlow)"/>

  <!-- Crescent moon -->
  <rect x="440" y="112" width="96" height="96" mask="url(#cm)" fill="#DDD8F8"/>

  <!-- Wordmark -->
  <text
    x="560"
    y="160"
    dominant-baseline="central"
    font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-1"
    fill="#F3F5FF"
  >LuniVex</text>

  <!-- Bottom horizon glow -->
  <rect x="0" y="230" width="1280" height="90" fill="url(#horizGrad)"/>
</svg>
